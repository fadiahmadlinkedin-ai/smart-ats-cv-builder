<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="author" content="{{AUTHOR}}">
<meta name="generator" content="smart-ats-cv-builder">
<style>
/*{{FONT_FACES}}*/
@page {
    size: A4;
    /* Thin maroon frame on every page (a page border, not a text element, so ATS
       readers see nothing). Text width stays 180 mm: 0.7 cm margin + 0.8 cm padding. */
    margin: 0.7cm;
    border: 1.5pt solid #800000;
    padding: 0.5cm 0.8cm 0.9cm 0.8cm;
    @bottom-center {
        content: "صفحة " counter(page);
        vertical-align: top;
        margin-top: -0.85cm;
        font-family: 'CV Naskh', 'CV Sans', sans-serif;
        font-size: 9pt;
        color: #777777;
    }
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
/* Arabic rule: never italicise Arabic script and never add letter-spacing
   (both break the joined letter forms). Emphasis uses weight and colour. */
body {
    font-family: 'CV Naskh', 'CV Sans', sans-serif;
    color: #1A1A1A;
    font-size: 11.5pt;
    line-height: 1.4;
    direction: rtl;
    text-align: right;
    letter-spacing: 0;
}
a { color: inherit; text-decoration: none; }
.name {
    font-family: 'CV Naskh', 'CV Sans', sans-serif;
    font-size: 24pt;
    font-weight: 700;
    text-align: center;
    margin-bottom: 3px;
    color: #800000;
}
.contact-line {
    text-align: center;
    font-size: 10pt;
    color: #555555;
    line-height: 1.5;
    margin-bottom: 1px;
}
.contact-line a { color: #555555; }
/* Divider: 50% wide and centred. Percentage side margins (not "auto") keep
   it centred on right-to-left pages too (margin:auto pushed it off the page
   in WeasyPrint RTL layouts). */
.maroon-line {
    display: block;
    height: 0;
    border: none;
    border-top: 1.5px solid #800000;
    width: 50%;
    margin: 5px 25%;
    break-after: avoid;
    page-break-after: avoid;
}
.section-title {
    font-family: 'CV Naskh', 'CV Sans', sans-serif;
    font-size: 14pt;
    font-weight: 700;
    text-align: center;
    color: #000000;
    margin: 0;
    padding: 1px 0;
    break-after: avoid;
    page-break-after: avoid;
}
.strengths-title {
    font-family: 'CV Naskh', 'CV Sans', sans-serif;
    font-size: 12.5pt;
    font-weight: 700;
    text-align: center;
    color: #000000;
    margin: 0;
    padding: 1px 0;
    break-after: avoid;
    page-break-after: avoid;
}
.summary-text {
    font-size: 11.5pt;
    text-align: justify;
    line-height: 1.5;
    margin: 4px 0;
    color: #1A1A1A;
}
.strengths-list {
    list-style-type: none;
    padding-right: 12px;
    padding-left: 0;
    margin: 4px 0;
}
.strengths-list li {
    font-size: 11.5pt;
    line-height: 1.45;
    margin-bottom: 1px;
    padding-right: 12px;
    text-indent: -12px;
    color: #1A1A1A;
}
.strengths-list li::before {
    content: "\2022";
    display: inline-block;
    width: 12px;
    text-indent: 0;
    color: #1A1A1A;
}
.exp-entry { margin-bottom: 8px; orphans: 3; widows: 3; }
.exp-company-line {
    font-size: 12.5pt;
    margin-bottom: 0;
    break-after: avoid;
    page-break-after: avoid;
}
.exp-company-name { font-weight: 700; color: #000000; }
.exp-location { color: #555555; font-size: 11pt; }
.exp-title-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 0;
    break-after: avoid;
    page-break-after: avoid;
}
.exp-job-title { font-size: 11.5pt; font-weight: 700; color: #000000; }
.exp-date { font-size: 10.5pt; color: #777777; white-space: nowrap; }
.exp-project { font-size: 10.5pt; color: #555555; margin: 1px 0 2px 0; }
.exp-achievements {
    margin: 3px 12px 0 0;
    font-size: 11.5pt;
    line-height: 1.45;
    color: #1A1A1A;
}
.exp-achievements p { margin-bottom: 2px; text-indent: -12px; padding-right: 12px; }
/* Indent style: no bullet symbol, wider indent */
.exp-achievements.indent-style p { text-indent: 0; padding-right: 22px; margin-bottom: 3px; }
.edu-entry { break-inside: avoid; page-break-inside: avoid; }
.row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
}
.edu-degree { font-size: 11.5pt; font-weight: 700; color: #000000; }
.edu-date { font-size: 10.5pt; color: #777777; white-space: nowrap; }
.edu-university { font-size: 11.5pt; color: #1A1A1A; }
.edu-location { font-size: 10pt; color: #555555; }
.edu-details { font-size: 10.5pt; color: #1A1A1A; }
.cert-row { margin-bottom: 3px; }
.cert-name { font-size: 11.5pt; color: #1A1A1A; }
.cert-date { font-size: 10.5pt; color: #777777; white-space: nowrap; }
.lang-item { font-size: 11.5pt; margin-bottom: 1px; color: #1A1A1A; }
.lang-item strong { font-weight: 700; }
.project-entry { margin-bottom: 6px; break-inside: avoid; page-break-inside: avoid; }
.project-name { font-size: 11.5pt; font-weight: 700; color: #000000; }
.project-date { font-size: 10.5pt; color: #777777; white-space: nowrap; }
.project-desc { font-size: 11.5pt; color: #1A1A1A; margin: 1px 0; }
.project-tech { font-size: 10pt; color: #555555; }
.volunteer-entry { margin-bottom: 6px; break-inside: avoid; page-break-inside: avoid; }
.volunteer-role { font-size: 11.5pt; font-weight: 700; color: #000000; }
.volunteer-org { font-size: 11.5pt; color: #1A1A1A; }
.volunteer-desc { font-size: 11.5pt; color: #1A1A1A; margin: 1px 0; }
.award-entry { margin-bottom: 3px; break-inside: avoid; page-break-inside: avoid; }
.award-name { font-size: 11.5pt; font-weight: 700; color: #000000; }
.award-date { font-size: 10.5pt; color: #777777; white-space: nowrap; }
.award-issuer { font-size: 10.5pt; color: #555555; }
.pub-entry { margin-bottom: 4px; break-inside: avoid; page-break-inside: avoid; }
.pub-title { font-size: 11.5pt; font-weight: 700; color: #000000; }
.pub-details { font-size: 10.5pt; color: #555555; }
/* Screen preview only (ignored when printing or rendering the PDF) */
.print-help { display: none; }
@media screen {
    html { background: #e8e8e8; }
    body {
        background: #ffffff;
        width: 210mm;
        min-height: 297mm;
        margin: 24px auto;
        padding: 1.2cm 1.5cm 1.6cm 1.5cm;
        outline: 1.5pt solid #800000;
        outline-offset: -0.7cm;
        box-shadow: 0 2px 12px rgba(0,0,0,0.18);
    }
    .print-help {
        display: block;
        font-family: 'CV Naskh', 'CV Sans', sans-serif;
        font-size: 10.5pt;
        line-height: 1.6;
        background: #fff8e1;
        border: 1px solid #e0c060;
        padding: 8px 12px;
        margin: 0 0 14px 0;
        color: #333333;
    }
}
@media print { .print-help { display: none !important; } }
/*{{EXTRA_CSS}}*/
</style>
</head>
<body>
{{PRINT_HELP}}
{{CONTENT}}
</body>
</html>
